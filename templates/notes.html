<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Notes</title>
  <link rel="stylesheet" href="/static/vendor/highlight/github.min.css">
  <link rel="stylesheet" href="/static/css/notes.css">
</head>
<body>
  <div class="modal-overlay" id="modal-overlay"></div>
  <div class="modal-content" id="modal-content">
    <button class="modal-close btn-danger" id="modal-close" type="button">Close</button>
    <div id="modal-body"></div>
  </div>

  <div class="container">
    <div class="page-header">
      <h1 class="page-title">Online Notes</h1>
      <div class="auth-area" id="auth-area">
        <button id="login-btn" class="btn-auth" type="button">Login</button>
        <span class="logged-in-area" id="logged-in-area">
          <span class="sync-badge">Synced</span>
          <button id="logout-btn" class="btn-danger" type="button">Logout</button>
        </span>
      </div>
    </div>

    <div class="login-dialog" id="login-dialog">
      <div class="login-row">
        <input type="password" id="login-password" class="login-password" placeholder="Enter password" />
        <div class="login-actions">
          <button id="login-confirm" class="btn-primary" type="button">OK</button>
          <button id="login-cancel" class="btn-secondary" type="button">Cancel</button>
        </div>
        <span id="login-error" class="login-error">Wrong password</span>
      </div>
    </div>

    <form id="note-form">
      <input type="hidden" id="note-id" />
      <input type="text" id="title" placeholder="Title" required />
      <div class="tag-picker" id="form-tag-picker">
        <div class="tag-picker-header">
          <span class="tag-picker-label">Tags</span>
          <span class="tag-picker-help">No selection falls back to default.</span>
        </div>
        <div class="tag-picker-options" id="tag-options"></div>
      </div>
      <textarea id="content" placeholder="Write markdown, code fences, and notes here..." required></textarea>
      <p class="form-help">Saved content stays as markdown source. Notes are rendered as preview when displayed.</p>
      <div class="form-actions">
        <button type="submit" class="btn-primary">Save</button>
        <button type="button" id="cancel-edit" class="btn-danger" style="display:none;">Cancel</button>
      </div>
    </form>

    <div id="notes"></div>
    <button id="show-more" type="button" style="display:none;">Show More Notes</button>
    <button id="show-less" type="button" style="display:none;">Show Less</button>
  </div>

  <script src="/static/vendor/marked/marked.umd.js"></script>
  <script src="/static/vendor/dompurify/purify.min.js"></script>
  <script src="/static/vendor/highlight/highlight.min.js"></script>
  <script src="/static/js/notes.js"></script>
</body>
</html>
