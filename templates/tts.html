<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text To Speech</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
      color: #333;
    }
    header {
      display: flex;
      align-items: center;
      padding: 1rem;
      background-color: #007bff;
      color: white;
    }
    header h1 {
      flex: 1;
      text-align: center;
      font-size: 1.2rem;
      margin: 0;
    }
    header a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    main {
      padding: 1rem;
      max-width: 600px;
      margin: auto;
    }
    textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 1rem;
      resize: vertical;
    }
    select {
      width: 100%;
      margin-top: 0.75rem;
      padding: 0.6rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 1rem;
      background: white;
    }
    .char-count {
      text-align: right;
      font-size: 0.8rem;
      color: #999;
      margin-top: 0.25rem;
    }
    .text-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.25rem;
    }
    .text-toolbar .char-count { margin-top: 0; }
    .text-actions { display: flex; gap: 0.5rem; }
    .text-actions button {
      margin-top: 0;
      width: auto;
      padding: 0.25rem 0.9rem;
      font-size: 0.8rem;
      background: #e9ecef;
      color: #333;
    }
    .text-actions button:hover { background: #dee2e6; }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.75rem;
      font-size: 0.9rem;
    }
    .slider-row label {
      width: 3.5rem;
      color: #555;
    }
    .slider-row input[type="range"] {
      flex: 1;
    }
    .slider-row .slider-value {
      width: 4rem;
      text-align: right;
      color: #007bff;
      font-variant-numeric: tabular-nums;
    }
    button {
      width: 100%;
      margin-top: 0.75rem;
      padding: 0.75rem;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background-color: #218838; }
    button:disabled { background-color: #6c757d; cursor: not-allowed; }
    #result { margin-top: 1rem; }
    #result audio { width: 100%; margin-top: 0.5rem; }
    #result a {
      display: inline-block;
      margin-top: 0.5rem;
      color: #007bff;
    }
    .error { color: #dc3545; }
    .mode-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .mode-tabs button {
      margin-top: 0;
      background: #e9ecef;
      color: #333;
    }
    .mode-tabs button.active {
      background: #007bff;
      color: white;
    }
    .record-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.75rem;
    }
    .record-row button {
      margin-top: 0;
      width: auto;
      padding: 0.6rem 1.2rem;
    }
    #recordBtn { background-color: #dc3545; }
    #recordBtn:hover { background-color: #c82333; }
    #recordBtn.recording { background-color: #6c757d; }
    #recordStatus { font-size: 0.9rem; color: #555; font-variant-numeric: tabular-nums; }
    .hidden { display: none; }
    .hint { font-size: 0.8rem; color: #999; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <header>
    <a href="/">Home</a>
    <h1>Text To Speech</h1>
  </header>
  <main>
    <form id="ttsForm">
      <div class="mode-tabs">
        <button type="button" id="tabText" class="active">⌨ 文字输入</button>
        <button type="button" id="tabMic">🎙 语音输入</button>
      </div>

      <div id="micMode" class="hidden">
        <div class="record-row">
          <button type="button" id="recordBtn">开始说话</button>
          <span id="recordStatus">点击后对着麦克风说话</span>
        </div>
        <select id="language">
          <option value="zh-CN">识别语言：中文</option>
          <option value="en-US">English</option>
          <option value="ja-JP">日本語</option>
          <option value="ko-KR">한국어</option>
        </select>
        <div class="hint">识别结果实时填入下方文本框，可手动修正后再生成语音</div>
      </div>

      <textarea id="text" rows="6" placeholder="输入要转换的文字，或切换到「语音输入」直接说话（最多 3000 字）"></textarea>
      <div class="text-toolbar">
        <div class="text-actions">
          <button type="button" id="copyBtn">复制</button>
          <button type="button" id="clearBtn">清除</button>
        </div>
        <div class="char-count"><span id="charCount">0</span>/3000</div>
      </div>

      <select id="voice"><option value="">加载声音列表中...</option></select>
      <div class="slider-row">
        <label for="pitch">音调</label>
        <input type="range" id="pitch" min="-50" max="50" value="45" />
        <span class="slider-value" id="pitchValue">+45Hz</span>
      </div>
      <div class="slider-row">
        <label for="rate">语速</label>
        <input type="range" id="rate" min="-50" max="100" value="-10" />
        <span class="slider-value" id="rateValue">-10%</span>
      </div>
      <button type="submit" id="submitButton">生成语音</button>
      <button type="button" id="cancelButton" class="hidden" style="background:#dc3545;">取消排队</button>
    </form>
    <div id="result"></div>
  </main>

  <script>
    const textInput = document.getElementById("text");
    const charCount = document.getElementById("charCount");
    const voiceSelect = document.getElementById("voice");
    const pitchInput = document.getElementById("pitch");
    const pitchValue = document.getElementById("pitchValue");
    const rateInput = document.getElementById("rate");
    const rateValue = document.getElementById("rateValue");
    const form = document.getElementById("ttsForm");
    const result = document.getElementById("result");
    const submitButton = document.getElementById("submitButton");
    const cancelButton = document.getElementById("cancelButton");

    const tabText = document.getElementById("tabText");
    const tabMic = document.getElementById("tabMic");
    const micMode = document.getElementById("micMode");
    const recordBtn = document.getElementById("recordBtn");
    const recordStatus = document.getElementById("recordStatus");
    const langSelect = document.getElementById("language");

    // 浏览器端语音识别（Web Speech API），识别结果直接进文本框；
    // 服务端保持纯 edge-tts，零新增后端依赖
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recog = null;
    let recognizing = false;

    tabText.addEventListener("click", () => {
      tabText.classList.add("active");
      tabMic.classList.remove("active");
      micMode.classList.add("hidden");
      if (recog && recognizing) recog.stop();
    });
    tabMic.addEventListener("click", () => {
      tabMic.classList.add("active");
      tabText.classList.remove("active");
      micMode.classList.remove("hidden");
      if (!SpeechRecognition) {
        recordStatus.textContent = "当前浏览器不支持语音识别，请用 Chrome / Edge / Safari";
        recordBtn.disabled = true;
      }
    });

    recordBtn.addEventListener("click", () => {
      if (!SpeechRecognition) return;

      if (recognizing) {
        recog.stop();
        return;
      }

      recog = new SpeechRecognition();
      recog.lang = langSelect.value;
      recog.continuous = true;
      recog.interimResults = true;

      // 以开始识别时文本框已有内容为前缀，识别结果追加在后面
      const prefix = textInput.value;
      let finalText = "";

      recog.onresult = (e) => {
        let interim = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
          else interim += e.results[i][0].transcript;
        }
        textInput.value = prefix + finalText + interim;
        syncCharCount();
      };
      recog.onerror = (e) => {
        const msgs = {
          "not-allowed": "麦克风权限被拒绝，请在浏览器地址栏允许",
          "network": "识别服务网络不可用（Chrome 走 Google 服务器，国内可能不通，可换 Edge/Safari）",
          "no-speech": "没有听到声音，请靠近麦克风重试",
          "service-not-allowed": "识别服务不可用",
        };
        recordStatus.textContent = msgs[e.error] || "识别出错：" + e.error;
      };
      recog.onend = () => {
        recognizing = false;
        recordBtn.classList.remove("recording");
        recordBtn.textContent = "开始说话";
        if (finalText) recordStatus.textContent = "识别完成，可修正文字后点「生成语音」";
      };

      recog.start();
      recognizing = true;
      recordBtn.classList.add("recording");
      recordBtn.textContent = "停止";
      recordStatus.textContent = "聆听中...";
    });

    function syncCharCount() {
      charCount.textContent = Array.from(textInput.value).length;
    }
    textInput.addEventListener("input", syncCharCount);

    const copyBtn = document.getElementById("copyBtn");
    const clearBtn = document.getElementById("clearBtn");

    copyBtn.addEventListener("click", async () => {
      if (!textInput.value) return;
      try {
        await navigator.clipboard.writeText(textInput.value);
      } catch {
        // 非 https 环境没有 clipboard API，回退到选区复制
        textInput.select();
        document.execCommand("copy");
      }
      copyBtn.textContent = "已复制";
      setTimeout(() => { copyBtn.textContent = "复制"; }, 1500);
    });

    clearBtn.addEventListener("click", () => {
      textInput.value = "";
      syncCharCount();
      textInput.focus();
    });

    const fmtSigned = (v, unit) => (v > 0 ? "+" : "") + v + unit;
    pitchInput.addEventListener("input", () => {
      pitchValue.textContent = fmtSigned(Number(pitchInput.value), "Hz");
    });
    rateInput.addEventListener("input", () => {
      rateValue.textContent = fmtSigned(Number(rateInput.value), "%");
    });

    // 加载声音列表；401 说明未登录
    fetch("/tts/voices").then((res) => {
      if (res.status === 401) {
        voiceSelect.innerHTML = '<option value="">请先在首页登录</option>';
        submitButton.disabled = true;
        return null;
      }
      return res.json();
    }).then((data) => {
      if (!data) return;
      voiceSelect.innerHTML = data.voices
        .map((v) => `<option value="${v.id}">${v.label}</option>`)
        .join("");
    }).catch(() => {
      voiceSelect.innerHTML = '<option value="">声音列表加载失败</option>';
    });

    // 提交后轮询任务状态（队列模式：admin 插队，最多 2 个并发执行）
    let currentJobId = null;
    let polling = false;

    function resetSubmitUI() {
      submitButton.disabled = false;
      submitButton.textContent = "生成语音";
      cancelButton.classList.add("hidden");
      currentJobId = null;
      polling = false;
    }

    cancelButton.addEventListener("click", async () => {
      if (!currentJobId) return;
      try {
        await fetch("/tts/jobs/" + currentJobId, { method: "DELETE" });
      } catch {}
      result.innerHTML = "<p>已取消排队。</p>";
      resetSubmitUI();
    });

    async function pollJob(jobId) {
      // 客户端兜底：最多轮询 10 分钟
      for (let i = 0; i < 300 && polling && currentJobId === jobId; i++) {
        await new Promise((r) => setTimeout(r, 2000));
        if (!polling || currentJobId !== jobId) return;
        let data;
        try {
          const res = await fetch("/tts/jobs/" + jobId);
          if (res.status === 404) {
            result.innerHTML = '<p class="error">任务不存在或已过期，请重新提交。</p>';
            return resetSubmitUI();
          }
          data = await res.json();
        } catch {
          continue; // 网络抖动，下一轮重试
        }
        if (data.status === "queued") {
          submitButton.textContent = data.position > 0
            ? `排队中...前面还有 ${data.position} 个任务`
            : "排队中...即将开始";
        } else if (data.status === "running") {
          submitButton.textContent = "生成中...";
          cancelButton.classList.add("hidden"); // running 不可取消
        } else if (data.status === "done") {
          result.innerHTML = `
            <audio controls autoplay src="${data.download_url}"></audio>
            <br/>
            <a href="${data.download_url}">下载 MP3</a>
          `;
          return resetSubmitUI();
        } else if (data.status === "failed") {
          result.innerHTML = `<p class="error">${data.error || "生成失败"}</p>`;
          return resetSubmitUI();
        }
      }
      if (polling && currentJobId === jobId) {
        result.innerHTML = '<p class="error">等待超时，请稍后重试或重新提交。</p>';
        resetSubmitUI();
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitButton.disabled = true;
      submitButton.textContent = "提交中...";
      result.innerHTML = "";
      try {
        const res = await fetch("/tts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text: textInput.value,
            voice: voiceSelect.value,
            pitch: Number(pitchInput.value),
            rate: Number(rateInput.value),
          }),
        });
        const data = await res.json();
        if (res.status === 202 && data.job_id) {
          currentJobId = data.job_id;
          polling = true;
          submitButton.textContent = data.position > 0
            ? `排队中...前面还有 ${data.position} 个任务`
            : "排队中...即将开始";
          cancelButton.classList.remove("hidden");
          pollJob(data.job_id);
        } else if (res.status === 401) {
          result.innerHTML = '<p class="error">未登录，请先在首页登录。</p>';
          resetSubmitUI();
        } else {
          result.innerHTML = `<p class="error">${data.error || "生成失败"}</p>`;
          resetSubmitUI();
        }
      } catch {
        result.innerHTML = '<p class="error">网络错误，请重试。</p>';
        resetSubmitUI();
      }
    });
  </script>
</body>
</html>
